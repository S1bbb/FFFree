name: Обновить расписание

on:
  schedule:
    - cron: "17 3 * * 1" # понедельник, 06:17 по Москве
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Скачать расписание
        run: python scraper.py -o data/schedule.json

      - name: Закоммитить, если изменилось
        run: |
          if git diff --quiet -- data/schedule.json; then
            echo "Расписание не изменилось"
            exit 0
          fi
          git diff --stat -- data/schedule.json
          version="rooms-$(date -u +%Y-%m-%d)-r${{ github.run_number }}"
          sed -i -E "s/^const VERSION = \"[^\"]*\";/const VERSION = \"$version\";/" sw.js
          grep -q "\"$version\"" sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json sw.js
          git commit -m "Обновить расписание ($version)"
          git push
